<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="async.css">
</head>
<body>
  <div class="controls">
    <button id="getAllBtn">Получить все карточки</button>
    <button id="deleteAllBtn">Удалить все карточки</button>
  </div>

  <div id="status" class="status"></div>

  <div id="usersContainer" class="users-container"></div>

  <template id="userCardTemplate">
    <div class="user-card">
      <h3 class="user-name"></h3>
      <p class="user-surname"></p>
      <p class="user-email"></p>
      <p class="user-age"></p>
      <button class="delete-btn">Удалить</button>
    </div>
  </template>

  <script src="async.js"></script>
</body>
</html>
