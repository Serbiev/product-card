<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style/style.css">
  <link rel="stylesheet" href="style/clear-list.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
  <main class="catalog">
    <div class="button-container">
      <button id="change-color-first-card-button" class="border-button">Сменить цвет первой карточки</button>
      <button id="change-color-all-cards-button" class="border-button">Сменить цвет всех карточек</button>
      <button id="open-Google-button" class="border-button">Открыть страницу Google.com</button>
      <button id="toggle-color-button" class="color-toggle-button">Переключать цвет кнопки</button>
      <button id="registration-button" class="button-registration">Регистрация</button>
    </div>
    <div class="container catalog__container">
      <h1 class="title catalog__title">Выбери свой продукт</h1>

        <ul id="product-list" class="products clear-list"></ul>
        <template id="product-template">
           <li class="card">
            <img class="card__image" src="images/mousse.png" alt="Увлажняющий мусс" width="290">
            <span class="card__category"></span>
            <h2 class="card__name"></h2>
            <p class="card__description"></p>

            <div class="card__compound compound">
              <span class="compound__name">Состав:</span>
              <ul class="compound__list"></ul>
            </div>

              <div class="card__price-block">
                <b class="card__price">Цена:</b>
                <span class="card__value"></span>
              </div>
          </li>
        </template>
    </div>

      <div id="modal" class="modal">
        <button id="button-close-modal" class="button-modal">&times;</button>
        <h3 class="title-modal">Регистрация</h3>
        <form class="form-registration" id="registration-form">

          <label class="label-registration">
            Имя:
            <input class="input-registration" placeholder="Введите имя" name="userName" required autocomplete="given-name">
          </label>

          <label class="label-registration">
            Фамилия:
            <input class="input-registration" placeholder="Введите фамилию" name="userSurname" required autocomplete="family-name">
          </label>

          <label class="label-registration">
            Дата рождения:
            <input class="input-registration" type="date" name="date" required autocomplete="bday">
          </label>

          <label class="label-registration">
            Логин:
            <input class="input-registration" placeholder="Логин" name="login" required autocomplete="username">
          </label>

          <label class="label-registration">
            Пароль:
            <input class="input-registration" placeholder="Введите пароль" type="password" name="password" required autocomplete="new-password">
          </label>

          <label class="label-registration">
            Введите пароль снова:
            <input class="input-registration" placeholder="Введите пароль" type="password" name="repeatPassword" required autocomplete="new-password">
          </label>

          <button type="submit" id="buttun-subscribe" class="subscribe-button-modal">Зарегистрироваться</button>

        </form>
      </div>

      <div class="overlay"></div>

  </main>

  <footer class="footer">
    <div class="footer__container">
      <div class="footer__logo">
        <h2 class="footer__title">Product Cards</h2>
        <p class="footer__description">У нас самые лучшие продукты для кожи!</p>
        <img class="logo" src="images/tg.svg" alt="Телеграм">
        <img class="logo" src="images/wk.svg" alt="ВКонтакте">
      </div>

      <div class="footer__subscribe">
        <h3 class="footer__subscribe-title">Подпишись на наши акции:</h3>

        <form id="email-form">
          <input class="footer__subscribe-input" name="email" type="email" required placeholder="Введи Email...">
          <button type="submit" class="footer__subscribe-button">Подписаться</button>
        </form>
        
      </div>

      <div class="footer__nav">
        <p class="footer__nav-title">Быстрые ссылки</p>
        <ul class="footer__nav-list clear-list">
          <li>Главная</li>
          <li>Магазин</li>
          <li>Контакты</li>
        </ul>
      </div>
    </div>
    <div class="footer__divider"></div>
    <p class="footer__copyright">www.product-cards.com©all right reserve</p>
  </footer>

  <script type="module" src="main.js"></script>
</body>
</html>
